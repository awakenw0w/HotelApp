spring.application.name=hotel-api
server.port=8080

# При необходимости эти значения можно заменить переменными среды DB_URL, DB_USERNAME и DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/booking_Bystrov?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Даты в ответах API будут передаваться текстом, например 2025-03-23.
spring.jackson.serialization.write-dates-as-timestamps=false
